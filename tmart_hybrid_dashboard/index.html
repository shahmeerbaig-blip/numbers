<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --page-plane:     #f9f9f7;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --gridline:       #e1e0d9;
      --baseline:       #c3c2b7;
      --border:         rgba(11,11,11,0.10);
      --series-1:       #2a78d6; /* blue */
      --status-good:      #0ca30c;
      --status-warning:   #fab219;
      --status-critical:  #d03b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        color-scheme: dark;
        --surface-1:      #1a1a19;
        --page-plane:     #0d0d0d;
        --text-primary:   #ffffff;
        --text-secondary: #c3c2b7;
        --text-muted:     #898781;
        --gridline:       #2c2c2a;
        --baseline:       #383835;
        --border:         rgba(255,255,255,0.10);
        --series-1:       #3987e5;
        --status-good:      #0ca30c;
        --status-warning:   #fab219;
        --status-critical:  #e66767;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--page-plane);
      color: var(--text-primary);
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .topbar h1 { font-size: 20px; margin: 0; }
    .topbar .meta { color: var(--text-secondary); font-size: 13px; }
    .refresh-btn {
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: var(--gridline); }
    .refresh-btn:disabled { opacity: 0.6; cursor: default; }

    .range-selector { display: flex; gap: 6px; margin-bottom: 20px; }
    .range-selector button {
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .range-selector button:hover { background: var(--gridline); }
    .range-selector button.active {
      color: var(--text-primary);
      border-color: var(--text-primary);
      font-weight: 600;
    }

    .card {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 16px; margin: 0 0 14px; }

    .error-banner {
      background: color-mix(in srgb, var(--status-critical) 12%, var(--surface-1));
      border: 1px solid var(--status-critical);
      color: var(--text-primary);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .series-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .series-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .series-box .name { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .series-box .value {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .series-box .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
    .status-good { background: var(--status-good); }
    .status-warning { background: var(--status-warning); }
    .status-critical { background: var(--status-critical); }
    .status-label { font-size: 11px; color: var(--text-secondary); font-weight: 500; margin-left: -4px; }

    .series-box canvas { max-height: 160px; }

    .table-toggle {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      margin-top: 10px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    table.data-table th, table.data-table td {
      text-align: left;
      padding: 4px 6px;
      border-bottom: 1px solid var(--gridline);
      color: var(--text-primary);
    }
    table.data-table th { color: var(--text-secondary); font-weight: 500; }
    .hidden { display: none; }
    .empty-state { color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="viz-root">
    <div class="wrap">
      <div class="topbar">
        <div>
          <h1>Tmart Hybrid Performance — Live Dashboard</h1>
          <div class="meta" id="lastUpdated">Loading…</div>
        </div>
        <button class="refresh-btn" id="refreshBtn">Refresh now</button>
      </div>

      <div class="range-selector" id="rangeSelector">
        <button data-days="7">7D</button>
        <button data-days="14">14D</button>
        <button data-days="30" class="active">30D</button>
        <button data-days="">All</button>
      </div>

      <div id="sections"></div>
    </div>
  </div>

  <script>
    var SECTION_ORDER = ['orderSummary', 'riderUtr', 'rtvViolation'];
    var AUTO_REFRESH_MS = 5 * 60 * 1000; // 5 minutes
    var charts = {}; // canvasId -> Chart instance
    var uid = 0;
    var currentDays = 30; // keep in sync with DEFAULT_RANGE_DAYS in Code.gs

    function fmtNumber(n) {
      if (n === undefined || n === null || isNaN(n)) return '—';
      return Math.abs(n) >= 1000 ? n.toLocaleString(undefined, { maximumFractionDigits: 1 })
                                  : (Math.round(n * 100) / 100).toString();
    }

    function statusLabel(status) {
      if (status === 'critical') return 'Off target';
      if (status === 'warning') return 'Watch';
      if (status === 'good') return 'On target';
      return '';
    }

    function renderSeriesBox(key, s) {
      uid++;
      var boxId = 'box-' + uid;
      var canvasId = 'chart-' + uid;
      var tableId = 'table-' + uid;

      var kpi = s.kpi;
      var dot = kpi && kpi.status ? '<span class="status-dot status-' + kpi.status + '"></span>' : '';
      var statusText = kpi && kpi.status ? '<span class="status-label">' + statusLabel(kpi.status) + '</span>' : '';

      var html = (
        '<div class="series-box" id="' + boxId + '">' +
          '<div class="name">' + s.name + '</div>' +
          '<div class="value">' + dot + (kpi ? fmtNumber(kpi.latest) : '—') + statusText + '</div>' +
          '<div class="sub">' + (kpi ? 'avg ' + fmtNumber(kpi.average) + ' · total ' + fmtNumber(kpi.total) : 'no data') + '</div>' +
          '<canvas id="' + canvasId + '"></canvas>' +
          '<button class="table-toggle" data-target="' + tableId + '">Show data</button>' +
          '<div id="' + tableId + '" class="hidden">' + renderSeriesTable(s) + '</div>' +
        '</div>'
      );

      var wrapper = document.createElement('div');
      wrapper.innerHTML = html;
      var node = wrapper.firstChild;

      node.querySelector('.table-toggle').addEventListener('click', function (e) {
        var target = document.getElementById(e.target.getAttribute('data-target'));
        var collapsed = target.classList.contains('hidden');
        target.classList.toggle('hidden');
        e.target.textContent = collapsed ? 'Hide data' : 'Show data';
      });

      drawLineChart(node.querySelector('#' + canvasId), s);
      return node;
    }

    function renderSeriesTable(s) {
      var head = '<tr><th>Date</th><th>Value</th></tr>';
      var body = s.dateLabels.map(function (d, i) {
        return '<tr><td>' + d + '</td><td>' + fmtNumber(s.values[i]) + '</td></tr>';
      }).join('');
      return '<table class="data-table">' + head + body + '</table>';
    }

    function renderSection(key, section) {
      var card = document.createElement('div');
      card.className = 'card';
      var html = '<h2>' + section.title + '</h2>';

      if (section.error) {
        html += '<div class="error-banner">Could not load this section: ' + section.error +
                '<br>Check CONFIG.sheets.' + key + ' in Code.gs (sheet name / pivot anchors).</div>';
        card.innerHTML = html;
        return card;
      }

      if (!section.series.length) {
        html += '<div class="empty-state">No data found yet.</div>';
        card.innerHTML = html;
        return card;
      }

      card.innerHTML = html;
      var grid = document.createElement('div');
      grid.className = 'series-grid';
      section.series.forEach(function (s) {
        s.kpi = section.kpis[s.name];
        grid.appendChild(renderSeriesBox(key, s));
      });
      card.appendChild(grid);
      return card;
    }

    function drawLineChart(canvas, s) {
      if (!canvas) return;
      var existing = charts[canvas.id];
      if (existing) existing.destroy();

      var root = document.querySelector('.viz-root');
      var seriesColor = getComputedStyle(root).getPropertyValue('--series-1').trim();
      var gridColor = getComputedStyle(root).getPropertyValue('--gridline').trim();
      var mutedColor = getComputedStyle(root).getPropertyValue('--text-muted').trim();

      charts[canvas.id] = new Chart(canvas, {
        type: 'line',
        data: {
          labels: s.dateLabels,
          datasets: [{
            data: s.values,
            borderColor: seriesColor,
            backgroundColor: seriesColor,
            borderWidth: 2,
            pointRadius: 2,
            pointHoverRadius: 5,
            tension: 0.15,
            fill: false,
            spanGaps: true,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: gridColor }, ticks: { color: mutedColor, maxRotation: 0, autoSkip: true } },
            y: { grid: { color: gridColor }, ticks: { color: mutedColor }, beginAtZero: true },
          },
        },
      });
    }

    function render(data) {
      document.getElementById('lastUpdated').textContent = 'Last updated ' + new Date(data.generatedAt).toLocaleString();

      var container = document.getElementById('sections');
      container.innerHTML = '';
      charts = {};
      SECTION_ORDER.forEach(function (key) {
        var section = data.sections[key];
        if (section) container.appendChild(renderSection(key, section));
      });
    }

    function showLoadError(err) {
      document.getElementById('lastUpdated').textContent = 'Failed to load: ' + (err && err.message ? err.message : err);
    }

    function refresh(forceBypassCache) {
      var btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Refreshing…';
      var fn = forceBypassCache ? google.script.run.forceRefreshDashboardData : google.script.run.getDashboardData;
      fn.withSuccessHandler(function (data) {
        render(data);
        btn.disabled = false;
        btn.textContent = 'Refresh now';
      }).withFailureHandler(function (err) {
        showLoadError(err);
        btn.disabled = false;
        btn.textContent = 'Refresh now';
      })(currentDays);
    }

    document.getElementById('refreshBtn').addEventListener('click', function () { refresh(true); });

    Array.prototype.forEach.call(document.querySelectorAll('#rangeSelector button'), function (btn) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('active')) return;
        Array.prototype.forEach.call(document.querySelectorAll('#rangeSelector button'), function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        var raw = btn.getAttribute('data-days');
        currentDays = raw === '' ? null : Number(raw);
        refresh(false);
      });
    });

    refresh(false);
    setInterval(function () { refresh(false); }, AUTO_REFRESH_MS);
  </script>
</body>
</html>
